<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Sohin Santhosh — full-stack + applied AI. Software Engineering Intern at Taxor.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1410"/>
      <stop offset="0.6" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f1f18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7ee787" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="960" cy="170" r="260" fill="url(#glow)"/>

    <!-- stack in orbit -->
    <g transform="translate(960 170)" fill="none">
      <circle r="62" stroke="#7ee787" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle r="104" stroke="#7ee787" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="3 7"/>
      <circle r="146" stroke="#7ee787" stroke-opacity="0.14" stroke-width="1.2"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        <circle cx="62" cy="0" r="7" fill="#7ee787"/>
        <circle cx="-62" cy="0" r="4" fill="#3fb950"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
        <circle cx="0" cy="-104" r="6" fill="#56d364"/>
        <circle cx="90" cy="52" r="4" fill="#f0f6fc"/>
        <circle cx="-90" cy="52" r="5" fill="#2ea043"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="44s" repeatCount="indefinite"/>
        <circle cx="146" cy="0" r="5" fill="#f0f6fc"/>
        <circle cx="-73" cy="126" r="7" fill="#3fb950"/>
        <circle cx="-73" cy="-126" r="4" fill="#7ee787"/>
      </g>

      <!-- asterisk mark -->
      <g stroke="#f0f6fc" stroke-width="5" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
        <path d="M0 -24V24M-20.8 -12L20.8 12M-20.8 12L20.8 -12"/>
      </g>
    </g>

    <!-- text -->
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="4" fill="#7ee787">KOCHI, INDIA · B.TECH CSE 2027</text>
      <text x="70" y="176" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#name)">Sohin Santhosh</text>
      <text x="72" y="224" font-size="27" font-weight="500" fill="#c9d1d9">Full-stack + applied AI<tspan fill="#7ee787" dx="6">▍<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

      <g transform="translate(72 254)">
        <rect width="372" height="42" rx="21" fill="#7ee787" fill-opacity="0.1" stroke="#7ee787" stroke-opacity="0.45"/>
        <circle cx="24" cy="21" r="5" fill="#3fb950">
          <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="42" y="27" font-size="17" font-weight="600" fill="#e6edf3">Software Engineering Intern at Taxor</text>
      </g>
    </g>
  </g>
</svg>
